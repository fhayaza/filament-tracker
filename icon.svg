<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="spoolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#spoolBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Outer Spool Flange Rim -->
  <circle cx="50" cy="50" r="38" fill="#141d30" stroke="#0284c7" stroke-width="2.5" />

  <!-- Filament Coils (Wound Rings) -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-dasharray="14 3" filter="url(#glow)" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#orangeGrad)" stroke-width="2.8" stroke-dasharray="12 2.5" />
  <circle cx="50" cy="50" r="23" fill="none" stroke="url(#cyanGrad)" stroke-width="2.6" stroke-dasharray="10 2" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="url(#orangeGrad)" stroke-width="2.4" />

  <!-- 4 Spool Spokes -->
  <line x1="22" y1="22" x2="78" y2="78" stroke="#090e1a" stroke-width="4.5" stroke-linecap="round" />
  <line x1="22" y1="22" x2="78" y2="78" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="78" x2="78" y2="22" stroke="#090e1a" stroke-width="4.5" stroke-linecap="round" />
  <line x1="22" y1="78" x2="78" y2="22" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Spool Inner Hub -->
  <circle cx="50" cy="50" r="13" fill="#141d30" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Center Spindle Hole -->
  <circle cx="50" cy="50" r="6" fill="#0b0f19" stroke="#0f172a" stroke-width="1.5" />
</svg>
